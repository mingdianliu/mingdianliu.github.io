<div class="recent-projects">
  {% for project in site.data.recent_projects %}
  <article class="project-feature" id="{{ project.id }}">
    <a class="project-feature__image" href="{{ project.links.first.url }}" aria-label="Explore {{ project.title | escape }}">
      <img src="{{ project.image | relative_url }}" alt="{{ project.image_alt | escape }}" width="720" height="450" loading="lazy" decoding="async">
    </a>
    <div class="project-feature__body">
      <p class="project-feature__eyebrow">{{ project.year }} <span aria-hidden="true">/</span> {{ project.category }}</p>
      <h3><a href="{{ project.links.first.url }}">{{ project.title }}</a></h3>
      <p>{{ project.description }}</p>
      <p class="project-feature__note">{{ project.note }}</p>
      <ul class="project-links" aria-label="{{ project.title | escape }} resources">
        {% for link in project.links %}
        <li><a href="{{ link.url }}">{{ link.label }} <span aria-hidden="true">↗</span></a></li>
        {% endfor %}
      </ul>
    </div>
  </article>
  {% endfor %}
</div>
