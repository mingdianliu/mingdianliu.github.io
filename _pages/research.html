<body>
  <main>
    <h1>Fieldnotes · 电磁研究室</h1>
    <p>正在进入共同研究空间……首次访问请使用你的专属邀请链接。</p>
    <a id="entrance" href="https://fieldnotes-room.lmdvigor.workers.dev/">进入研究室</a>
  </main>
  <script>
    const destination = new URL('https://fieldnotes-room.lmdvigor.workers.dev/');
    const session = new URLSearchParams(location.search).get('session');
    if (session && /^\d+$/.test(session)) destination.searchParams.set('session', session);
    destination.hash = location.hash;
    document.getElementById('entrance').href = destination.href;
    location.replace(destination.href);
  </script>
